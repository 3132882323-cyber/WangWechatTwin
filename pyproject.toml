[project]
name = "wang-wechat-twin"
version = "0.3.0"
description = "Local WeChat reply assistant with style memory and review controls"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
  "openai>=2.0.0,<3.0.0",
  "pydantic>=2.10,<3.0",
  "PyYAML>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "zstandard>=0.25.0,<1.0.0",
  "Pillow>=10.4",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
windows = ["wxauto4==41.1.7", "psutil", "pywin32"]
dev = ["pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
