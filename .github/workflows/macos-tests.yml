name: macOS draft edition
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runner architecture
        run: uname -m
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests -q
      - name: Chrome bridge unit tests
        run: node --test browser_extension/*.test.cjs
      - name: macOS launcher shell syntax
        run: bash -n START_HERE.command
